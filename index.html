<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Swiggy Smart Handoff prototype</title>
<style>
:root{--o:#FC8019;--tx:#282C3F;--mu:#6b7080;--bg:#f1f2f6;--sf:#fff;--ln:#e4e6ee;--gn:#1a8f5f;--gb:#e3f6ee;--am:#a86300;--ab:#fff3dc;--rd:#d93a3a;--rb:#fde8e8;--ob:#fff1e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#f2f3f7;--mu:#a3a8b8;--bg:#14151a;--sf:#1f2129;--ln:#2e313c;--gn:#3ccf91;--gb:#12362a;--am:#f0a63a;--ab:#3a2c0e;--rd:#ff7070;--rb:#3d1b1b;--ob:#3a2412}}
:root[data-theme="dark"]{--tx:#f2f3f7;--mu:#a3a8b8;--bg:#14151a;--sf:#1f2129;--ln:#2e313c;--gn:#3ccf91;--gb:#12362a;--am:#f0a63a;--ab:#3a2c0e;--rd:#ff7070;--rb:#3d1b1b;--ob:#3a2412}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;gap:8px;justify-content:space-between;align-items:center;max-width:420px;margin:0 auto;padding:12px 12px 8px}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:3px}
.seg button{border:0;background:none;color:var(--mu);padding:6px 12px;border-radius:16px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--o);color:#fff}
.rs{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:20px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
.phone{max-width:420px;margin:0 auto 8px;background:var(--sf);min-height:620px;border:1px solid var(--ln);border-radius:24px;overflow:hidden}
@media(max-width:440px){.phone{border-radius:0;border-left:0;border-right:0}}
.hd{padding:14px 16px;border-bottom:1px solid var(--ln)}.hd b{font-size:17px;display:block}
.bd{padding:14px 16px 20px;display:grid;gap:12px}
.card{border:1px solid var(--ln);border-radius:14px;padding:12px;background:var(--sf)}
.mu{color:var(--mu);font-size:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.row b{text-align:right;font-weight:600}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:var(--o);color:#fff;cursor:pointer}
.btn.s{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.btn.g{background:#1a8f5f;color:#fff}
.btn.r{background:var(--rb);color:var(--rd);border:1px solid var(--rd)}
.btn:disabled{opacity:.5;cursor:default}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.ok{background:var(--gb);color:var(--gn)}.bad{background:var(--rb);color:var(--rd)}.warn{background:var(--ab);color:var(--am)}.mute{background:var(--bg);color:var(--mu)}.or{background:var(--ob);color:var(--o)}
.al{border-radius:12px;padding:10px 12px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eta{text-align:center}.eta b{display:block;font-size:20px}
.tl{display:grid;gap:7px}.tl div{display:flex;gap:8px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--ln);flex:none}.dn .dot{background:var(--gn)}.cu .dot{background:var(--o)}.cu{font-weight:600}
.hint{max-width:420px;margin:0 auto 20px;padding:0 14px;color:var(--mu);font-size:12px;text-align:center}
.gt{cursor:pointer}svg text{font-family:inherit}
.lnk{background:none;border:0;color:var(--mu);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
</style></head><body>
<div class="top"><div class="seg" id="sw"></div><button class="rs" onclick="A.reset()">Reset demo</button></div>
<div class="phone" id="app"></div><div class="hint" id="hint"></div>
<script>
const IR=[{t:'10:15 PM',g:'A',s:'c'},{t:'10:32 PM',g:'B',s:'c'},{t:'10:48 PM',g:'C',s:'o'},{t:'11:05 PM',g:'C',s:'o'},{t:'11:20 PM',g:'C',s:'o'}];
const IP={gate:'A',tower:'4',flat:'803',instr:'Call on arrival. Leave with security at the gate if no answer.',saved:true};
const GN={A:'Main entrance',B:'East entrance, usually closed after 10 PM',C:'Service entrance'};
const LB={o:'Accessible',c:'Closed',m:'Mixed reports',n:'No reports'},CL={o:'ok',c:'bad',m:'warn',n:'mute'};
const R={A:[[95,225],[130,225],[130,195],[130,150],[160,124]],B:[[95,225],[278,225],[278,110],[250,110],[206,112]],C:[[95,225],[22,225],[22,110],[50,110],[110,110],[158,112]]};
const GP={A:[130,195],B:[250,110],C:[50,110]};
const $=s=>document.querySelector(s);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let prefs=ld('sh_p',IP),reports=ld('sh_r',IR),S;
function fresh(){S={v:'c',step:'co',order:'none',sel:null,at:'A',blocked:null,why:'',door:'8:40 PM',edit:false,err:'',toast:'',clk:0}}fresh();
function gs(g){const rs=reports.filter(r=>r.g===g);if(!rs.length)return{k:'n',ok:0,n:0};const l=rs[rs.length-1],p=rs[rs.length-2];return{k:p&&p.s!==l.s?'m':l.s==='o'?'o':'c',ok:rs.filter(r=>r.s==='o').length,n:rs.length}}
function rec(){const x=['A','B','C'].map(g=>({g,...gs(g)}));const o=x.filter(a=>a.k==='o').sort((a,b)=>b.ok-a.ok)[0];if(o)return{g:o.g,ok:o.ok,c:0};const m=x.find(a=>a.k==='m');return m?{g:m.g,ok:m.ok,c:1}:null}
function pickAlt(b){const sc={o:2,m:1,n:.5,c:0};return['A','B','C'].filter(g=>g!==b).map(g=>({g,v:sc[gs(g).k]+(g===S.sel?.5:0)})).sort((p,q)=>q.v-p.v)[0].g}
function clock(){const m=30+2*S.clk++,h=11+Math.floor(m/60),mm=String(m%60).padStart(2,'0');return h<12?`${h}:${mm} PM`:`12:${mm} AM`}
function push(g,s){reports.push({t:clock(),g,s,src:'p'});sv('sh_r',reports)}
function reroute(b,why){S.blocked=b;S.why=why;S.at=pickAlt(b);S.order='rerouted';S.door='8:50 PM'}
const chip=k=>`<span class="chip ${CL[k]}">${LB[k]}</span>`;
const hd=(t,s)=>`<div class="hd"><b>${t}</b><span class="mu">${s}</span></div>`;
function mapSvg(inter){const pts=R[S.at],rd=S.order==='delivered'?pts[pts.length-1]:pts[1],col={o:'var(--gn)',c:'var(--rd)',m:'var(--am)',n:'var(--mu)'};
const gates=Object.keys(GP).map(k=>{const[x,y]=GP[k];return`<g ${inter?`class="gt" onclick="A.at('${k}')"`:''}><circle cx="${x}" cy="${y}" r="${k===S.at?12:10}" fill="${col[gs(k).k]}" stroke="${k===S.at?'var(--tx)':'var(--sf)'}" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">${k}</text></g>`}).join('');
const tw=[[62,'T1'],[128,'T2'],[194,'T3']].map(([x,l])=>`<rect x="${x}" y="58" width="44" height="28" rx="4" fill="var(--sf)" stroke="var(--ln)"/><text x="${x+22}" y="76" text-anchor="middle" font-size="11" fill="var(--mu)">${l}</text>`).join('');
return`<svg viewBox="0 0 300 252" width="100%" role="img" aria-label="Stylised map of Green Valley Society with Gates A, B, C and Road C"><defs><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#e8a33a"/></pattern></defs><rect x="0" y="214" width="300" height="24" fill="var(--ln)"/><rect x="14" y="40" width="16" height="198" fill="url(#h)" stroke="#e8a33a" stroke-width=".5"/><text x="22" y="32" text-anchor="middle" font-size="11" fill="var(--am)">Road C</text><rect x="50" y="45" width="200" height="150" rx="8" fill="var(--gb)" stroke="var(--gn)"/><text x="150" y="36" text-anchor="middle" font-size="11" fill="var(--mu)">Green Valley Society</text>${tw}<rect x="160" y="100" width="44" height="34" rx="4" fill="var(--o)"/><text x="182" y="121" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">T4</text><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--o)" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>${gates}<circle cx="${rd[0]}" cy="${rd[1]}" r="6" fill="var(--tx)" stroke="var(--sf)" stroke-width="2"/></svg><div class="mu" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px"><span>Road C: under construction</span><span>Dot: delivery partner</span></div>`}
function repList(){return[...reports].reverse().slice(0,7).map(r=>`<div class="row"><span>${r.t} · Gate ${r.g}${r.src?' <span class="chip or">Partner</span>':''}</span>${chip(r.s==='o'?'o':'c')}</div>`).join('')}
function checkout(){const p=prefs,f=!p.saved||S.edit;
const form=`<div style="display:grid;gap:8px"><div><label>Preferred gate</label><select id="fg">${['A','B','C'].map(g=>`<option value="${g}" ${p.gate===g?'selected':''}>Gate ${g}: ${GN[g]}</option>`).join('')}</select></div><div class="g2"><div><label>Tower</label><input id="ft" value="${E(p.tower)}" placeholder="4"></div><div><label>Flat</label><input id="ff" value="${E(p.flat)}" placeholder="803"></div></div><div><label>Delivery instructions</label><textarea id="fi" rows="2" placeholder="e.g. Call on arrival">${E(p.instr)}</textarea></div>${S.err?`<div class="chip bad">${S.err}</div>`:''}<button class="btn" onclick="A.save()">Save for future orders</button></div>`;
const view=`<div class="row"><span class="mu">Society</span><b>Green Valley Society, Sector 62</b></div><div class="row"><span class="mu">Address</span><b>Tower ${E(p.tower)}, Flat ${E(p.flat)}</b></div><div class="row"><span class="mu">Preferred gate</span><b>Gate ${p.gate} · ${GN[p.gate].split(',')[0]}</b></div><div class="row"><span class="mu">Instructions</span><b>${E(p.instr)||'None'}</b></div><button class="btn s" onclick="A.edit()">Edit details</button>`;
return hd('Checkout','Delivering to Green Valley Society')+`<div class="bd"><div class="card"><div class="row" style="padding-top:0"><b>Smart Handoff</b>${p.saved&&!S.edit?'<span class="chip ok">Saved</span>':'<span class="chip or">Add details</span>'}</div>${f?form:view}</div><button class="btn" ${p.saved&&!S.edit?'':'disabled'} onclick="A.next()">Review entrance</button>${p.saved?'':''}<div style="text-align:center"><button class="lnk" onclick="A.first()">Simulate first-time user</button></div></div>`}
function recScreen(){const r=rec();let a,b='';if(!r)a=`No recent reports. We’ll use your saved gate, Gate ${prefs.gate}.`;else if(r.c){a=`Reports for Gate ${r.g} conflict.`;b='Your delivery partner will verify it on arrival.'}else{a=`Gate ${r.g} may be the easiest entrance right now.`;b=`${r.ok} recent delivery reports indicate Gate ${r.g} is accessible after 10 PM.`}
const g=r?r.g:prefs.gate,same=g===prefs.gate;
return hd('Recommended entrance','Based on recent, anonymised reports')+`<div class="bd"><div class="al ${r&&!r.c?'ok':'warn'}"><b style="font-size:16px">${a}</b><div>${b}</div></div><div class="card"><div class="mu" style="margin-bottom:4px">Recent reports · not guaranteed live</div>${repList()}</div>${same?`<button class="btn" onclick="A.pick('${g}')">Continue with Gate ${g}</button>`:`<button class="btn" onclick="A.pick('${g}')">Use Gate ${g}</button><button class="btn s" onclick="A.pick('${prefs.gate}')">Keep Gate ${prefs.gate}</button>`}</div>`}
function track(){const d=S.order==='delivered',r=S.order==='rerouted',g=r||d?S.at:S.sel,st=d?4:r?2:1,ch=S.door!=='8:40 PM';
const steps=['Order picked up','Approaching society','At society gate','Handoff at your door'].map((t,i)=>`<div class="${i<st?'dn':i===st?'cu':''}"><span class="dot"></span>${t}</div>`).join('');
return hd('Live tracking',d?'Delivered':r?'Delivery partner is taking the alternative route':'Delivery partner approaching society')+`<div class="bd">${r?`<div class="al warn"><b>Access update</b><br>${S.why==='b'?`Gate ${S.blocked} is blocked.`:`Gate ${S.blocked} isn’t being used.`} Your partner is taking Gate ${S.at} instead. Doorstep ETA moved from 8:40 PM to 8:50 PM.</div>`:''}${d?`<div class="al ok"><b>Delivered to Tower ${E(prefs.tower)}, Flat ${E(prefs.flat)}</b><br>Handoff complete via Gate ${S.at}.</div>`:''}
<div class="g2"><div class="card eta"><span class="mu">Reaches society</span><b>8:35 PM</b></div><div class="card eta"><span class="mu">Reaches your door</span><b>${ch?'<s class="mu" style="font-size:13px">8:40 PM</s> ':''}${S.door}</b></div></div>
<div class="card"><div class="row" style="padding-top:0"><span class="mu">Entrance</span><b>Gate ${g} · ${GN[g].split(',')[0]} ${ch?'<span class="chip warn">Updated</span>':''}</b></div><div class="row"><span class="mu">Building</span><b>Tower ${E(prefs.tower)}, Flat ${E(prefs.flat)}</b></div><div class="row"><span class="mu">Status</span><b>${d?'Delivered':r?'Taking alternative route':'On the way'}</b></div></div><div class="card"><div class="tl">${steps}</div></div><div class="card">${mapSvg(false)}</div></div>`}
function partner(){const o=S.order;
if(o==='none')return hd('Delivery access details','No active delivery')+`<div class="bd"><div class="card" style="text-align:center"><b>No active order</b><div class="mu">Accept a Smart Handoff recommendation in the customer view to create a delivery.</div></div><button class="btn" onclick="A.view('c')">Go to customer view</button></div>`;
const det=`<div class="card"><div class="row" style="padding-top:0"><span class="mu">Society</span><b>Green Valley Society, Sector 62, Noida</b></div><div class="row"><span class="mu">Tower, flat</span><b>Tower ${E(prefs.tower)}, Flat ${E(prefs.flat)}</b></div><div class="row"><span class="mu">Instructions</span><b>${E(prefs.instr)||'None'}</b></div></div>`;
if(o==='delivered')return hd('Delivery complete','Order #SW48213')+`<div class="bd"><div class="al ok"><b>Handoff complete</b><br>Delivered to Tower ${E(prefs.tower)}, Flat ${E(prefs.flat)} via Gate ${S.at}. Your Gate ${S.at} report helps future deliveries.</div><button class="btn s" onclick="A.reset()">Reset demo</button></div>`;
if(o==='rerouted')return hd('Alternative route','Gate '+S.blocked+' → Gate '+S.at+' → Tower '+E(prefs.tower))+`<div class="bd"><div class="al warn"><b>Rerouted to Gate ${S.at}</b><br>Customer notified. Doorstep ETA updated to ${S.door}.</div><div class="card">${mapSvg(false)}<div class="row"><span class="mu">Gate ${S.at} status</span>${chip(gs(S.at).k)}</div></div>${det}<button class="btn g" onclick="A.done()">Complete handoff</button></div>`;
const s=gs(S.at),al=pickAlt(S.at),r=rec();
return hd('Delivery access details','Order #SW48213 · You’re nearest Gate A')+`<div class="bd"><div class="card"><div class="row" style="padding:0"><span class="mu">Recommended entrance</span><b>Gate ${S.sel}${r&&r.c?' (verify)':''}</b></div></div>${det}<div class="card">${mapSvg(true)}<div class="mu">Tap a gate to set where you are.</div><div class="row"><span>Gate ${S.at} · ${s.n} reports</span>${chip(s.k)}</div>${s.k==='m'?'<div class="chip warn">Reports conflict. Verify on arrival.</div>':''}</div><button class="btn g" onclick="A.ok()">Gate accessible</button><button class="btn r" onclick="A.blk()">Gate blocked</button><button class="btn s" onclick="A.alt()">Use alternative gate (Gate ${al})</button></div>`}
function render(){$('#sw').innerHTML=`<button class="${S.v==='c'?'on':''}" onclick="A.view('c')">Customer</button><button class="${S.v==='p'?'on':''}" onclick="A.view('p')">Delivery partner</button>`;
const sc=S.v==='c'?(S.order!=='none'?track():S.step==='co'?checkout():recScreen()):partner();
$('#app').innerHTML=(S.toast?`<div class="al ok" style="margin:12px 16px 0"><b>${S.toast}</b></div>`:'')+sc;
const h={none:S.step==='co'?'Step 1: Check the saved details, then tap Review entrance.':'Steps 2 and 3: Accept the Gate C recommendation.',active:S.v==='c'?'Step 4: Switch to Delivery partner to see the access details.':'Steps 5 and 6: Tap Gate blocked (the partner is at Gate A), or switch to Gate C.',rerouted:S.v==='c'?'Step 7: Access update and revised ETA shown. Switch to Delivery partner to finish.':'Step 8: Complete the handoff, or check the customer view for the update.',delivered:'Demo complete. Reset demo to run it again.'};
$('#hint').textContent=h[S.order]}
function T(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},2500)}
const A={view(v){S.v=v;render()},
edit(){S.edit=true;S.err='';render()},
save(){const t=$('#ft').value.trim(),f=$('#ff').value.trim();if(!t||!f){S.err='Enter tower and flat';render();return}prefs={gate:$('#fg').value,tower:t,flat:f,instr:$('#fi').value.trim(),saved:true};sv('sh_p',prefs);S.edit=false;S.err='';T('Saved. We’ll reuse this next time.')},
first(){prefs={gate:'A',tower:'',flat:'',instr:'',saved:false};sv('sh_p',prefs);S.edit=false;S.err='';render()},
next(){if(prefs.saved){S.step='rec';render()}},
pick(g){S.sel=g;S.at='A';S.order='active';T(`Gate ${g} selected`)},
at(k){if(S.order==='active'){S.at=k;render()}},
ok(){push(S.at,'o');T(`Gate ${S.at} reported accessible`)},
blk(){const b=S.at;push(b,'c');reroute(b,'b');T(`Gate ${b} reported blocked. Customer notified.`)},
alt(){reroute(S.at,'s');T(`Switched to Gate ${S.at}. Customer notified.`)},
done(){S.order='delivered';T('Delivery completed')},
reset(){reports=JSON.parse(JSON.stringify(IR));prefs={...IP};sv('sh_r',reports);sv('sh_p',prefs);fresh();render()}};
render();
</script></body></html>
